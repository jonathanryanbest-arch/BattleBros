version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: battlebros
      POSTGRES_USER: battlebros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battlebros-dev-pw}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battlebros"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://battlebros:${POSTGRES_PASSWORD:-battlebros-dev-pw}@db:5432/battlebros
      GROQ_API_KEY: ${GROQ_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      VIRTUAL_HOST: treatquest.johnbest.ai
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: treatquest.johnbest.ai
      LETSENCRYPT_EMAIL: jbest@jsbjr.digital

volumes:
  db_data:
